networks:
  aeronet:
    driver: bridge

services:

  # ───────────────────────────────────────────────────────────────────────
  # Infrastructure
  # ───────────────────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    container_name: aerobot-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aeroagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aeroagent"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aeronet

  redis:
    image: redis:7-alpine
    container_name: aerobot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aeronet

  minio:
    image: minio/minio
    container_name: aerobot-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console → http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      # mc ready local falla sin alias configurado; el endpoint HTTP es la forma oficial.
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aeronet

  # ───────────────────────────────────────────────────────────────────────
  # One-shot initializers (restart: "no" → terminan y no se reinician)
  # ───────────────────────────────────────────────────────────────────────

  minio-init:
    image: minio/mc
    container_name: aerobot-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/aeroagent-docs &&
        echo 'Bucket aeroagent-docs listo'
      "
    networks:
      - aeronet
    restart: "no"

  migrations:
    build:
      context: ../../app
      dockerfile: botBackEnd/Dockerfile
    container_name: aerobot-migrations
    # Ejecuta las migraciones TypeORM desde la lib @aero-agent/database.
    # El script "typeorm" en libs/database/package.json corre el CLI con ts-node.
    command: pnpm --filter @aero-agent/database run typeorm migration:run
    env_file:
      - ../../app/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aeroagent
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aeronet
    restart: "no"

  # ───────────────────────────────────────────────────────────────────────
  # Application services
  # ───────────────────────────────────────────────────────────────────────

  botBackEnd:
    build:
      context: ../../app
      dockerfile: botBackEnd/Dockerfile
    container_name: aerobot-api
    ports:
      - "3000:3000"
    env_file:
      - ../../app/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aeroagent
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks:
      - aeronet
    restart: unless-stopped

  botWorker:
    build:
      context: ../../app
      dockerfile: botWorker/Dockerfile
    container_name: aerobot-worker
    env_file:
      - ../../app/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aeroagent
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks:
      - aeronet
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
